name: Feature request
description: Suggest an improvement for Localisten.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Localisten is a showcase for Apple's on-device speech recognition.
        Please keep requests focused on demonstrating local, private speech recognition on Apple devices.
  - type: textarea
    id: need
    attributes:
      label: What would this help with?
      description: Describe the demo, presentation, or workflow problem this would solve.
      placeholder: This would help when...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Localisten would this affect?
      options:
        - Live transcription
        - Microphone or audio capture
        - Recognition accuracy
        - Language or locale handling
        - On-device recognition availability
        - Permissions
        - Audio session or interruptions
        - Settings screen
        - Documentation
        - Build or project setup
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behavior
      description: What would you like Localisten to do?
      placeholder: Localisten should...
    validations:
      required: true
  - type: dropdown
    id: offline_privacy
    attributes:
      label: Offline and privacy impact
      description: Can this feature preserve Localisten's on-device processing and user privacy?
      options:
        - Keeps speech processing on-device
        - Might require network access or external services
        - Not sure
    validations:
      required: true
  - type: textarea
    id: ui_notes
    attributes:
      label: UI notes or examples
      description: Add screenshots, recordings, links, or rough sketches if this changes the interface.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
      description: Link examples or describe approaches you already tried, if applicable.
